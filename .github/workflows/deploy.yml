name: Build, Verify & Deploy ArthaPulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Actions, Pages deployment, and release artifacts
permissions:
  contents: write
  pages: write
  id-token: write

# Concurrency to prevent overlapping deployments to GitHub Pages
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linting & Type Check
        run: npm run lint

      - name: Build Full-Stack Production Bundle (Vite + Express Server)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare GitHub Pages Fallback (SPA 404 Handling)
        run: cp dist/index.html dist/404.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arthapulse-dist
          path: dist/
          retention-days: 7

  pages:
    name: Deploy to GitHub Pages (Static Web Preview)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arthapulse-dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  docker:
    name: Docker Container Build Check
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: arthapulse:latest
