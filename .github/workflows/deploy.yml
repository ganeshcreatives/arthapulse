name: Build, Verify & Deploy ArthaPulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Actions, Pages deployment, gh-pages branch push, and release artifacts
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linting & Type Check
        run: npm run lint

      - name: Build Full-Stack Production Bundle (Vite + Express Server)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare GitHub Pages Fallback (SPA 404 Handling)
        run: cp dist/index.html dist/404.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arthapulse-dist
          path: dist/
          retention-days: 7

  pages:
    name: Deploy to GitHub Pages (Static Web Preview)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://ganeshcreatives.github.io/arthapulse/' }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arthapulse-dist
          path: dist

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
        continue-on-error: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Publish Deployment Links in Job Summary
        if: always()
        run: |
          echo "### 🌐 ArthaPulse Deployment Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **GitHub Pages URL**: [https://ganeshcreatives.github.io/arthapulse/](https://ganeshcreatives.github.io/arthapulse/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **Development App URL**: [https://ais-dev-zrnhehxm2jd57apowgvxl3-233901165083.asia-east1.run.app](https://ais-dev-zrnhehxm2jd57apowgvxl3-233901165083.asia-east1.run.app)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **Shared Preview URL**: [https://ais-pre-zrnhehxm2jd57apowgvxl3-233901165083.asia-east1.run.app](https://ais-pre-zrnhehxm2jd57apowgvxl3-233901165083.asia-east1.run.app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ **To Activate GitHub Pages**: Go to [Repository Settings → Pages](https://github.com/ganeshcreatives/arthapulse/settings/pages). Under **Build and deployment > Source**, select **GitHub Actions** (or branch \`gh-pages\`)." >> $GITHUB_STEP_SUMMARY

  docker:
    name: Docker Container Build Check
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: arthapulse:latest
