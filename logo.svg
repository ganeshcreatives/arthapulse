<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18" />
      <stop offset="50%" stop-color="#08142A" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bar Chart Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Horizontal Light Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Cyber Dark Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" />

  <!-- Radial Ambience Glow -->
  <circle cx="550" cy="220" r="280" fill="#00D2FF" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="300" cy="240" r="200" fill="#0284C7" opacity="0.06" filter="url(#softGlow)" />

  <!-- Circuit Board Traces on Top Right -->
  <g stroke="#00D2FF" stroke-opacity="0.22" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 690 90 L 730 90 L 760 120 L 810 120" />
    <circle cx="810" cy="120" r="3.5" fill="#00D2FF" fill-opacity="0.5" />
    
    <path d="M 720 50 L 760 50 L 790 80 L 840 80" />
    <circle cx="840" cy="80" r="3.5" fill="#00D2FF" fill-opacity="0.5" />

    <path d="M 740 160 L 780 160 L 800 180 L 835 180" />
    <circle cx="835" cy="180" r="3" fill="#00D2FF" fill-opacity="0.5" />

    <path d="M 700 230 L 750 230 L 775 255 L 820 255" />
    <circle cx="820" cy="255" r="3.5" fill="#00D2FF" fill-opacity="0.5" />

    <path d="M 770 110 L 800 140 L 800 170" />
    <path d="M 830 130 L 860 130" />
    <circle cx="860" cy="130" r="3.5" fill="#00D2FF" fill-opacity="0.5" />
  </g>

  <!-- Circuit Board Traces on Left Side -->
  <g stroke="#00D2FF" stroke-opacity="0.18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 70 230 L 110 230 L 130 210 L 150 210" />
    <circle cx="70" cy="230" r="3" fill="#00D2FF" fill-opacity="0.4" />
    <path d="M 90 270 L 130 270 L 145 285" />
    <circle cx="90" cy="270" r="3" fill="#00D2FF" fill-opacity="0.4" />
  </g>

  <!-- ============================================== -->
  <!-- 1. PULSE / HEARTBEAT WAVEFORM (Transitions to Bars) -->
  <!-- ============================================== -->
  <path d="M 90 240 L 175 240 L 195 210 L 210 275 L 235 125 L 260 300 L 280 220 L 305 245 L 325 240 L 350 240"
        fill="none"
        stroke="#00E5FF"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#cyanGlow)" />

  <!-- Pulse Connection Nodes -->
  <circle cx="195" cy="210" r="3.5" fill="#FFFFFF" />
  <circle cx="235" cy="125" r="4.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
  <circle cx="260" cy="300" r="4" fill="#FFFFFF" />

  <!-- ============================================== -->
  <!-- 2. RISING BAR CHART (11 Columns) -->
  <!-- ============================================== -->
  <g filter="url(#cyanGlow)">
    <!-- Bar 1 -->
    <rect x="330" y="275" width="14" height="20" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 2 -->
    <rect x="355" y="265" width="14" height="30" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 3 -->
    <rect x="380" y="250" width="14" height="45" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 4 -->
    <rect x="405" y="235" width="14" height="60" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 5 -->
    <rect x="430" y="225" width="14" height="70" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 6 -->
    <rect x="455" y="205" width="14" height="90" rx="3.5" fill="url(#barGrad)" />
    <!-- Bar 7 -->
    <rect x="480" y="185" width="15" height="110" rx="4" fill="url(#barGrad)" />
    <!-- Bar 8 -->
    <rect x="506" y="160" width="16" height="135" rx="4" fill="url(#barGrad)" />
    <!-- Bar 9 -->
    <rect x="533" y="140" width="17" height="155" rx="4" fill="url(#barGrad)" />
    <!-- Bar 10 -->
    <rect x="561" y="115" width="18" height="180" rx="4.5" fill="url(#barGrad)" />
    <!-- Bar 11 -->
    <rect x="590" y="85" width="20" height="210" rx="5" fill="url(#barGrad)" />
  </g>

  <!-- ============================================== -->
  <!-- 3. RISING TRAJECTORY ARROW -->
  <!-- ============================================== -->
  <g filter="url(#cyanGlow)">
    <!-- Curving dynamic path over bars -->
    <path d="M 330 270 Q 420 240 500 195 T 670 65"
          fill="none"
          stroke="#00E5FF"
          stroke-width="5"
          stroke-linecap="round" />

    <!-- Trajectory Point Dots -->
    <circle cx="330" cy="270" r="4.5" fill="#38BDF8" />
    <circle cx="450" cy="225" r="4.5" fill="#00E5FF" />
    <circle cx="550" cy="160" r="5" fill="#00E5FF" />

    <!-- Arrowhead pointing up-right (↗) -->
    <polygon points="675,55 640,70 655,90" fill="#00E5FF" />
    <polygon points="675,55 650,85 680,85" fill="#38BDF8" />
  </g>

  <!-- ============================================== -->
  <!-- 4. BRAND NAME: ArthaPulse -->
  <!-- ============================================== -->
  <g id="brand-text">
    <text x="450" y="440" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="94" letter-spacing="-1">
      <tspan fill="#FFFFFF">Artha</tspan><tspan fill="#00D2FF" filter="url(#cyanGlow)">Pulse</tspan>
    </text>
  </g>

  <!-- ============================================== -->
  <!-- 5. SLOGAN: Feel the Market. See the Future. -->
  <!-- ============================================== -->
  <g id="slogan-text">
    <text x="450" y="495" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="28" fill="#E2E8F0" letter-spacing="4.5">
      Feel the Market. See the Future.
    </text>
  </g>

  <!-- Horizontal Glow Beam beneath slogan -->
  <rect x="250" y="530" width="400" height="3" fill="url(#beamGrad)" filter="url(#cyanGlow)" />
  <circle cx="450" cy="531.5" r="3" fill="#FFFFFF" filter="url(#cyanGlow)" />
</svg>
